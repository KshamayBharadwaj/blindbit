{% extends "base.html" %}
{% block title %}Sign In — BlindBit{% endblock %}
{% block content_public %}
<style>
  .brutal-card {
    background: #FFFFFF;
    border: 1px solid #E5E7EB;
    border-radius: 12px;
  }
  .brutal-card:hover {
    transform: translate(-2px, -2px);
  }
  .brutal-input {
    border: 1px solid #E5E7EB;
    background: #FFFFFF;
    border-radius: 8px;
    transition: all 0.1s;
  }
  .brutal-input:focus {
    outline: none;
    border-color: #202124;
    box-shadow: 0 0 0 3px #F3F4F6;
    background: #FFFFFF;
  }
  .brutal-btn {
    border: 1px solid #E5E7EB;
    border-radius: 8px;
    transition: all 0.08s;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    cursor: pointer;
  }
  .brutal-btn:hover {
    transform: translate(-3px, -3px);
  }
  .brutal-btn:active {
    transform: translate(2px, 2px);
  }
  .brutal-btn-primary {
    background: #202124;
    color: #FFFFFF;
    border-color: #202124;
  }
  .brutal-btn-secondary {
    background: #FFFFFF;
    color: #202124;
  }
  .brutal-btn-disabled {
    background: #F3F4F6;
    color: #9CA3AF;
    border-color: #E5E7EB;
    cursor: not-allowed;
  }
  .brutal-btn-disabled:hover {
    transform: none;
  }
  .brutal-tag {
    background: #F3F4F6;
    color: #202124;
    border-radius: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    padding: 4px 10px;
    display: inline-block;
  }
  .bg-stripes {
    background-image: repeating-linear-gradient(
      -45deg,
      transparent,
      transparent 8px,
      rgba(32,33,36,0.04) 8px,
      rgba(32,33,36,0.04) 16px
    );
  }
  .dot-corner {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #E5E7EB;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 16px;
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    cursor: pointer;
    border: 1px solid #E5E7EB;
    border-radius: 8px;
    transition: all 0.1s;
    text-align: center;
  }
  .tab-btn.active {
    background: #202124;
    color: #FFFFFF;
  }
  .tab-btn:not(.active) {
    background: #FFFFFF;
    color: #6B7280;
  }
  .tab-btn:not(.active):hover {
    background: #F3F4F6;
    color: #202124;
  }
</style>

<div class="min-h-[calc(100vh-68px)] flex items-center justify-center px-4 py-12 relative overflow-hidden">
  <div class="absolute inset-0 pointer-events-none opacity-20">
    <div class="absolute top-20 left-12 w-3 h-3 bg-[#202124] rotate-45"></div>
    <div class="absolute bottom-32 right-16 w-5 h-5 bg-[#202124] border-2 border-[#E5E7EB] rotate-12"></div>
    <div class="absolute top-1/3 right-1/4 w-2 h-2 bg-[#202124] rounded-full"></div>
    <div class="absolute bottom-1/4 left-8 w-4 h-4 border-2 border-[#E5E7EB]"></div>
  </div>

  <div class="w-full max-w-[440px] relative">
    <div class="flex items-center gap-2 mb-4">
      <span class="brutal-tag">Auth</span>
      <div class="h-[3px] flex-1 bg-[#202124]"></div>
    </div>

    <div class="brutal-card p-8 sm:p-10 relative">
      <div class="dot-corner -top-[4px] -left-[4px]"></div>
      <div class="dot-corner -top-[4px] -right-[4px]"></div>
      <div class="dot-corner -bottom-[4px] -left-[4px]"></div>
      <div class="dot-corner -bottom-[4px] -right-[4px]"></div>

      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 bg-[#202124] flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 fill-white" viewBox="0 0 16 16"><path d="M8 1L1 4v4c0 4 3.5 7 7 8 3.5-1 7-4 7-8V4L8 1z"/></svg>
        </div>
        <div>
          <h1 class="text-2xl font-bold tracking-tight" style="font-family:'Space Grotesk',sans-serif;">Sign In</h1>
          <p class="text-xs font-mono text-gray-500 mt-0.5">Unlock your encrypted vault</p>
        </div>
      </div>

      <!-- Tabs -->
      <div class="flex mb-6 border border-[#E5E7EB] rounded-lg">
        <button id="tab-passkey" class="tab-btn active" onclick="switchTab('passkey')">Passkey</button>
        <button id="tab-passphrase" class="tab-btn" onclick="switchTab('passphrase')">Passphrase</button>
      </div>

      <!-- Passkey tab content -->
      <div id="tab-content-passkey">
        <form id="login-form" class="space-y-5">
          {% csrf_token %}
          <div>
            <label for="username-passkey" class="font-mono font-bold text-xs tracking-wider block mb-2">
              Username <span class="text-red-500 ml-0.5">*</span>
            </label>
            <input type="text" id="username-passkey" name="username" required placeholder="alice"
              class="brutal-input w-full px-4 py-3.5 font-mono text-sm" />
          </div>
          <button id="login-btn" type="submit"
            class="brutal-btn brutal-btn-primary w-full py-4 flex items-center justify-center gap-3">
            <span>Authenticate with Passkey</span>
            <svg class="w-4 h-4 stroke-white stroke-[2.5] fill-none flex-shrink-0" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12,5 19,12 12,19"/></svg>
          </button>
        </form>
      </div>

      <!-- Passphrase tab content -->
      <div id="tab-content-passphrase" class="hidden">
        <div class="space-y-5">
          <div>
            <label for="username-passphrase" class="font-mono font-bold text-xs tracking-wider block mb-2">
              Username <span class="text-red-500 ml-0.5">*</span>
            </label>
            <input type="text" id="username-passphrase" required placeholder="alice"
              class="brutal-input w-full px-4 py-3.5 font-mono text-sm" />
          </div>
          <div>
            <label for="passphrase" class="font-mono font-bold text-xs tracking-wider block mb-2">
              Passphrase <span class="text-red-500 ml-0.5">*</span>
            </label>
            <div class="relative">
              <input type="password" id="passphrase" placeholder="Enter your passphrase"
                autocomplete="off"
                class="brutal-input w-full px-4 py-3.5 pr-12 font-mono text-sm" />
              <button type="button" id="toggle-passphrase-vis"
                class="absolute right-3 top-1/2 -translate-y-1/2 p-1 cursor-pointer bg-transparent border-none flex items-center justify-center text-gray-400 hover:text-[#202124] transition-colors">
                <svg id="eye-icon" class="w-5 h-5 stroke-current stroke-2 fill-none" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg id="eye-off-icon" class="w-5 h-5 stroke-current stroke-2 fill-none hidden" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>
          <button id="send-otp-btn" type="button"
            class="brutal-btn brutal-btn-primary w-full py-4 flex items-center justify-center gap-3">
            <span>Send Verification Code</span>
            <svg class="w-4 h-4 stroke-white stroke-[2.5] fill-none flex-shrink-0" viewBox="0 0 24 24"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg>
          </button>
          <div id="otp-section" class="hidden">
            <div class="flex items-center gap-3 mb-4">
              <div class="h-[2px] flex-1 bg-[#202124] opacity-20"></div>
              <span class="font-mono font-bold text-[0.6rem] tracking-[0.15em] text-gray-400">Check Your Email</span>
              <div class="h-[2px] flex-1 bg-[#202124] opacity-20"></div>
            </div>
            <div>
              <label for="otp-input" class="font-mono font-bold text-xs tracking-wider block mb-2">
                Verification Code <span class="text-red-500 ml-0.5">*</span>
              </label>
              <input type="text" id="otp-input" maxlength="6" inputmode="numeric" pattern="[0-9]*"
                placeholder="000000" autocomplete="one-time-code"
                class="brutal-input w-full px-4 py-3.5 text-center text-lg font-mono font-bold tracking-[0.5em]" />
            </div>
            <button id="passphrase-submit-btn" type="button"
              class="brutal-btn brutal-btn-primary w-full py-4 mt-4 flex items-center justify-center gap-3">
              <span>Sign In with Passphrase</span>
              <svg class="w-4 h-4 stroke-white stroke-[2.5] fill-none flex-shrink-0" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12,5 19,12 12,19"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div id="error-msg" class="mt-5 p-4 border-3 border-red-500 bg-red-50 text-red-700 text-sm font-mono hidden"></div>
    </div>

    <div class="mt-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-sm">
      <a href="{% url 'accounts:register' %}" class="font-bold text-[#202124] underline underline-offset-4 decoration-2 hover:text-[#202124] transition-colors font-mono text-xs tracking-wider">
        Create Account →
      </a>
      <a href="{% url 'accounts:recovery' %}" class="text-gray-500 underline underline-offset-4 hover:text-[#202124] transition-colors font-mono text-xs tracking-wider">
        Recover
      </a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function getDeviceName() {
  const ua = navigator.userAgent;
  let os = 'Unknown OS';
  if (ua.includes('Win')) os = 'Windows';
  else if (ua.includes('Mac') && !ua.includes('iPhone') && !ua.includes('iPad')) os = 'macOS';
  else if (ua.includes('Linux') && !ua.includes('Android')) os = 'Linux';
  else if (ua.includes('Android')) os = 'Android';
  else if (ua.includes('iPhone') || ua.includes('iPad') || ua.includes('iPod')) os = 'iOS';
  let browser = 'Browser';
  if (ua.includes('Chrome') && !ua.includes('Edg') && !ua.includes('OPR')) browser = 'Chrome';
  else if (ua.includes('Firefox') && !ua.includes('Seamonkey')) browser = 'Firefox';
  else if (ua.includes('Safari') && !ua.includes('Chrome') && !ua.includes('Edg')) browser = 'Safari';
  else if (ua.includes('Edg')) browser = 'Edge';
  else if (ua.includes('OPR') || ua.includes('Opera')) browser = 'Opera';
  return `${browser} on ${os}`;
}

function b642ab(b64) {
  b64 = b64.replace(/-/g, '+').replace(/_/g, '/');
  return Uint8Array.from(atob(b64), function(c) { return c.charCodeAt(0); });
}

function ab2b64(ab) {
  return btoa(String.fromCharCode.apply(null, new Uint8Array(ab)));
}

function hex2ab(hexStr) {
  return new Uint8Array(hexStr.match(/.{2}/g).map(function(b) { return parseInt(b, 16); }));
}

// WebAuthn PRF helpers: the passkey derives a per-device key from the stored
// salt via the PRF extension; that key unwraps the master key with no
// passphrase and nothing persisted on the device.
function b64url(bytes) {
  return ab2b64(bytes).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64url2ab(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  return b642ab(s);
}
async function derivePrfWrappingKey(salt, prfOutput) {
  var base = await crypto.subtle.importKey('raw', prfOutput, 'HKDF', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'HKDF', hash: 'SHA-256', salt: salt, info: new TextEncoder().encode('BlindBit PRF wrapping key v1') },
    base,
    { name: 'AES-GCM', length: 256 },
    false,
    ['wrapKey', 'unwrapKey']
  );
}

async function sha256Hex(str) {
  var enc = new TextEncoder().encode(str);
  var hash = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(hash)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
}

// ── Tab switching ──

function switchTab(tab) {
  document.getElementById('tab-passkey').classList.toggle('active', tab === 'passkey');
  document.getElementById('tab-passphrase').classList.toggle('active', tab === 'passphrase');
  document.getElementById('tab-content-passkey').classList.toggle('hidden', tab !== 'passkey');
  document.getElementById('tab-content-passphrase').classList.toggle('hidden', tab !== 'passphrase');
  document.getElementById('error-msg').classList.add('hidden');
}

// ── Passkey Login ──

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username-passkey').value.trim();
  const errorEl = document.getElementById('error-msg');
  const loginBtn = document.getElementById('login-btn');

  errorEl.classList.add('hidden');
  loginBtn.disabled = true;
  loginBtn.textContent = 'Checking...';

  if (!username) {
    errorEl.textContent = 'please enter your username.';
    errorEl.classList.remove('hidden');
    loginBtn.disabled = false;
    loginBtn.innerHTML = '<span>Authenticate with Passkey</span><svg class="w-4 h-4 stroke-white stroke-[2.5] fill-none flex-shrink-0" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12,5 19,12 12,19"/></svg>';
    return;
  }

  try {
    var beginResp = await fetch('{% url "accounts:login_begin" %}', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
      body: JSON.stringify({ username }),
    });
    var beginData = await beginResp.json();

    if (beginData.error) {
      errorEl.textContent = beginData.error;
      errorEl.classList.remove('hidden');
      loginBtn.disabled = false;
      loginBtn.innerHTML = '<span>Authenticate with Passkey</span><svg class="w-4 h-4 stroke-white stroke-[2.5] fill-none flex-shrink-0" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12,5 19,12 12,19"/></svg>';
      return;
    }

    if (beginData.has_verified_credentials && beginData.allowCredentials && beginData.allowCredentials.length > 0) {
      beginData.challenge = b642ab(beginData.challenge);
      beginData.allowCredentials.forEach(function(cred) {
        cred.id = b642ab(cred.id);
      });

      // PRF: ask the authenticator to evaluate the stored salt so the master
      // key can be restored from the passkey itself.
      var prfRequest = null;
      if (beginData.prf_enabled && beginData.prf_salt && beginData.wrapped_master_key_prf) {
        try {
          prfRequest = { salt: hex2ab(beginData.prf_salt), wrapped: beginData.wrapped_master_key_prf };
          beginData.extensions = { prf: { eval: { first: b64url(prfRequest.salt) } } };
        } catch (e) { prfRequest = null; }
      }

      var assertion;
      try {
        assertion = await navigator.credentials.get({ publicKey: beginData });
      } catch (getErr) {
        var getMsg = 'passkey authentication cancelled or failed. try the passphrase tab.';
        if (getErr && getErr.name === 'NotAllowedError') {
          getMsg = 'no matching passkey on this device, or the prompt timed out. use the browser profile where this passkey was created.';
        } else if (getErr && getErr.name === 'InvalidStateError') {
          getMsg = 'this passkey does not match your account.';
        }
        errorEl.textContent = getMsg;
        errorEl.classList.remove('hidden');
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<span>Authenticate with Passkey</span><svg class="w-4 h-4 stroke-white stroke-[2.5] fill-none flex-shrink-0" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12,5 19,12 12,19"/></svg>';
        return;
      }

      var assertResp = assertion.response;
      var credPayload = {
        id: assertion.id,
        raw_id: ab2b64(assertion.rawId),
        response: {
          client_data_json: ab2b64(assertResp.clientDataJSON),
          authenticator_data: ab2b64(assertResp.authenticatorData),
          signature: ab2b64(assertResp.signature),
          user_handle: assertResp.userHandle ? ab2b64(assertResp.userHandle) : null,
        },
      };

      try {
        var completeResp = await fetch('{% url "accounts:login_complete" %}', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
          body: JSON.stringify({ credential: credPayload }),
        });
        var completeData = null;
        try { completeData = await completeResp.json(); } catch (parseErr) {}

        if (completeData && completeData.status === 'ok') {
          if (prfRequest) {
            try {
              const prfResult = assertion.getClientExtensionResults();
              if (prfResult && prfResult.prf && prfResult.prf.results && prfResult.prf.results.first) {
                const prfOutput = b64url2ab(prfResult.prf.results.first);
                const prfWrappingKey = await derivePrfWrappingKey(prfRequest.salt, prfOutput);
                const mk = await BlindBitCrypto.unwrapKey(prfWrappingKey, prfRequest.wrapped);
                if (mk) {
                  window.BlindBitMasterKey = mk;
                  const rawMk = await crypto.subtle.exportKey('raw', mk);
                  var rawB64 = btoa(String.fromCharCode.apply(null, new Uint8Array(rawMk)));
                  if (typeof blindBitSaveMasterKey === 'function') {
                    blindBitSaveMasterKey(rawB64, username);
                  } else {
                    try { sessionStorage.setItem('blindbit_master_key_raw_' + username, rawB64); } catch(e){}
                    try { sessionStorage.setItem('blindbit_master_key_raw', rawB64); } catch(e){}
                  }
                }
              }
            } catch (e) { /* PRF failed — unlock modal covers passphrase accounts */ }
          }
          window.location.href = completeData.is_onboarded ? '{% url "vault:dashboard" %}' : '{% url "accounts:register" %}';
          return;
        }

        errorEl.textContent = (completeData && completeData.error) ||
          'authentication failed (server error ' + completeResp.status + ').';
        errorEl.classList.remove('hidden');
      } catch (completeErr) {
        errorEl.textContent = 'connection error while completing sign-in. is the server running?';
        errorEl.classList.remove('hidden');
      }
    } else {
      errorEl.textContent = 'no passkey found for this account. use the passphrase tab or recovery.';
      errorEl.classList.remove('hidden');
    }
  } catch (err) {
    errorEl.textContent = 'Connection error. Is the server running?';
    errorEl.classList.remove('hidden');
  }

  loginBtn.disabled = false;
  loginBtn.innerHTML = '<span>Authenticate with Passkey</span><svg class="w-4 h-4 stroke-white stroke-[2.5] fill-none flex-shrink-0" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12,5 19,12 12,19"/></svg>';
});

// ── Passphrase + OTP Login ──

var passphraseState = {};

document.getElementById('send-otp-btn').addEventListener('click', async () => {
  const username = document.getElementById('username-passphrase').value.trim();
  const passphrase = document.getElementById('passphrase').value;
  const errorEl = document.getElementById('error-msg');
  const btn = document.getElementById('send-otp-btn');

  errorEl.classList.add('hidden');

  if (!username) { errorEl.textContent = 'please enter your username.'; errorEl.classList.remove('hidden'); return; }
  if (!passphrase) { errorEl.textContent = 'Please enter your passphrase.'; errorEl.classList.remove('hidden'); return; }

  btn.disabled = true;
  btn.textContent = 'Sending Code...';

  try {
    var beginResp = await fetch('{% url "accounts:login_begin" %}', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
      body: JSON.stringify({ username }),
    });
    var beginData = await beginResp.json();
    if (beginData.error) { throw new Error(beginData.error); }
    if (!beginData.has_passphrase) { throw new Error('No passphrase configured for this account.'); }

    var wrappedMk = beginData.wrapped_master_key_passphrase || '';
    var saltHex = beginData.passphrase_salt || '';
    var passphraseVerifier = '';

    if (wrappedMk && saltHex) {
      var salt = new Uint8Array(saltHex.match(/.{2}/g).map(function(b) { return parseInt(b, 16); }));
      var wrappingKey = await BlindBitCrypto.deriveKeyFromPassphrase(passphrase, salt);
      try {
        var mk = await BlindBitCrypto.unwrapKey(wrappingKey, wrappedMk);
        window.BlindBitMasterKey = mk;
        var rawMk = await crypto.subtle.exportKey('raw', mk);
        var rawB64 = btoa(String.fromCharCode.apply(null, new Uint8Array(rawMk)));
        if (typeof blindBitSaveMasterKey === 'function') {
          blindBitSaveMasterKey(rawB64, username);
        } else {
          try { sessionStorage.setItem('blindbit_master_key_raw_' + username, rawB64); } catch(e){}
          try { sessionStorage.setItem('blindbit_master_key_raw', rawB64); } catch(e){}
        }
        passphraseVerifier = await sha256Hex(wrappedMk);
      } catch (unwrapErr) {
        throw new Error('Invalid passphrase.');
      }
    } else {
      throw new Error('Unable to verify passphrase for this account.');
    }

    passphraseState.verifier = passphraseVerifier;
    passphraseState.username = username;
    passphraseState.wrappedMk = wrappedMk;
    passphraseState.saltHex = saltHex;

    var otpResp = await fetch('{% url "accounts:login_send_otp" %}', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
      body: JSON.stringify({ username }),
    });
    var otpData = await otpResp.json();
    if (otpData.error) { throw new Error(otpData.error); }

    document.getElementById('send-otp-btn').classList.add('hidden');
    document.getElementById('otp-section').classList.remove('hidden');
    document.getElementById('otp-input').focus();
  } catch (e) {
    errorEl.textContent = e.message;
    errorEl.classList.remove('hidden');
    btn.disabled = false;
    btn.innerHTML = '<span>Send Verification Code</span><svg class="w-4 h-4 stroke-white stroke-[2.5] fill-none flex-shrink-0" viewBox="0 0 24 24"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg>';
  }
});

document.getElementById('passphrase-submit-btn').addEventListener('click', async () => {
  const otp = document.getElementById('otp-input').value.trim();
  const errorEl = document.getElementById('error-msg');
  const btn = document.getElementById('passphrase-submit-btn');

  errorEl.classList.add('hidden');

  if (!otp || otp.length !== 6) {
    errorEl.textContent = 'Please enter the 6-digit verification code.';
    errorEl.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Signing In...';

  try {
    const resp = await fetch('{% url "accounts:login_passphrase" %}', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
      body: JSON.stringify({
        username: passphraseState.username,
        passphrase_verifier: passphraseState.verifier,
        device_name: getDeviceName(),
        otp: otp,
      }),
    });
    const data = await resp.json();

    if (data.status === 'ok') {
      window.location.href = data.is_onboarded ? '{% url "vault:dashboard" %}' : '{% url "accounts:register" %}';
    } else {
      errorEl.textContent = data.error || 'Verification failed.';
      errorEl.classList.remove('hidden');
      btn.disabled = false;
      btn.innerHTML = '<span>Sign In with Passphrase</span><svg class="w-4 h-4 stroke-white stroke-[2.5] fill-none flex-shrink-0" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12,5 19,12 12,19"/></svg>';
    }
  } catch (err) {
    errorEl.textContent = 'Connection error. Is the server running?';
    errorEl.classList.remove('hidden');
    btn.disabled = false;
    btn.innerHTML = '<span>Sign In with Passphrase</span><svg class="w-4 h-4 stroke-white stroke-[2.5] fill-none flex-shrink-0" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12,5 19,12 12,19"/></svg>';
  }
});

document.getElementById('toggle-passphrase-vis')?.addEventListener('click', () => {
  const input = document.getElementById('passphrase');
  const eye = document.getElementById('eye-icon');
  const eyeOff = document.getElementById('eye-off-icon');
  const isPass = input.type === 'password';
  input.type = isPass ? 'text' : 'password';
  eye.classList.toggle('hidden', !isPass);
  eyeOff.classList.toggle('hidden', isPass);
});
</script>
{% endblock %}
